<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Chips</title>
<style>
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--paper-3); color: var(--ink);
  border: 2px solid var(--ink); padding: 5px 11px 4px;
  font-family: var(--font-sans); font-weight: 800;
  font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
}
.chip.pink{background:var(--pink)} .chip.cyan{background:var(--cyan)}
.chip.yellow{background:var(--yellow)} .chip.green{background:var(--green)}
.chip.purple{background:var(--purple)} .chip.orange{background:var(--orange)}
.eyebrow { font-weight: 900; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
</style></head><body><div class="surface">
<div class="eyebrow">Sound</div>
<div class="chips" style="margin-bottom: 14px;">
  <span class="chip yellow">UK Garage</span><span class="chip yellow">Speed Garage</span>
  <span class="chip yellow">Dubstep 140</span><span class="chip">Burial</span>
  <span class="chip">The Streets</span><span class="chip cyan">Jay Dilla</span>
  <span class="chip cyan">MF Doom</span><span class="chip cyan">Wu-Tang</span>
</div>
<div class="eyebrow">Architecture</div>
<div class="chips">
  <span class="chip">Brutalism</span><span class="chip">Concrete</span>
  <span class="chip pink">90s Rave Flyers</span><span class="chip pink">Post-Apocalyptic</span>
</div>
</div></body></html>
