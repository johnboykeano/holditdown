<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Spacing</title>
<style>
.bar { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
.bar .blk { background: var(--ink); height: 14px; }
.bar .lab { font-family: var(--font-mono); font-size: 11px; color: var(--ink); width: 90px; }
.bar .px { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
</style></head><body><div class="surface">
<div class="bar"><div class="lab">--sp-1</div><div class="blk" style="width:4px;"></div><div class="px">4px</div></div>
<div class="bar"><div class="lab">--sp-2</div><div class="blk" style="width:8px;"></div><div class="px">8px</div></div>
<div class="bar"><div class="lab">--sp-3</div><div class="blk" style="width:12px;"></div><div class="px">12px</div></div>
<div class="bar"><div class="lab">--sp-4</div><div class="blk" style="width:16px;"></div><div class="px">16px</div></div>
<div class="bar"><div class="lab">--sp-6</div><div class="blk" style="width:24px;"></div><div class="px">24px</div></div>
<div class="bar"><div class="lab">--sp-8</div><div class="blk" style="width:32px;"></div><div class="px">32px</div></div>
<div class="bar"><div class="lab">--sp-12</div><div class="blk" style="width:48px;"></div><div class="px">48px</div></div>
<div class="bar"><div class="lab">--sp-20</div><div class="blk" style="width:80px;"></div><div class="px">80px</div></div>
</div></body></html>
