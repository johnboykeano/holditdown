<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Stickers</title>
<style>
.row { display: flex; flex-wrap: wrap; gap: 18px 14px; padding: 18px 0 6px; }
.sticker {
  display: inline-block; padding: 6px 12px 7px;
  background: var(--pink); color: var(--ink);
  border: 2.5px solid var(--ink);
  font-family: var(--font-sans); font-weight: 900; font-size: 12px;
  letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;
  box-shadow: 2px 2px 0 var(--ink);
  transform: rotate(-2deg);
}
.sticker.cyan{background:var(--cyan)} .sticker.yellow{background:var(--yellow)}
.sticker.green{background:var(--green)} .sticker.purple{background:var(--purple)}
.sticker.orange{background:var(--orange)}
.sticker.r1 { transform: rotate(1.5deg); }
.sticker.r2 { transform: rotate(-3deg); }
</style></head><body><div class="surface">
<span class="sticker">★ Right Now ★</span>
<span class="sticker cyan r1">The Build</span>
<span class="sticker yellow r2">Aesthetic DNA</span>
<span class="sticker green">How The Brain Works</span>
<span class="sticker purple r1">What's Hard</span>
<span class="sticker orange r2">Dropping Soon</span>
</div></body></html>
