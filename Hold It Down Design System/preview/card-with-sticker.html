<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Card</title>
<style>
.card {
  background: var(--paper-2); border: 2.5px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink); position: relative; padding: 28px 20px 22px;
  margin: 18px 8px 8px 0;
}
.sticker {
  position: absolute; top: -13px; left: 14px;
  background: var(--pink); color: var(--ink); border: 2.5px solid var(--ink);
  font-weight: 900; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 5px 11px 6px; transform: rotate(-2deg);
  box-shadow: 2px 2px 0 var(--ink); white-space: nowrap;
}
.card-title { font-weight: 900; font-size: 17px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); margin-bottom: 10px; }
.card-body p { font-size: 14px; line-height: 1.65; color: var(--ink-soft); }
.card-body strong { font-weight: 900; color: var(--ink); text-transform: uppercase; font-size: 0.9em; letter-spacing: 0.04em; }
</style></head><body><div class="surface">
<div class="card">
  <span class="sticker">★ Right Now ★</span>
  <div class="card-title">What's Live</div>
  <div class="card-body"><p>Just shipped the first app. Building the second brain. Getting on top of it one page at a time. <strong>The sidequest circuit is the reset circuit.</strong></p></div>
</div>
</div></body></html>
