<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Callsign Footer</title>
<style>
.foot {
  border-top: 2.5px solid var(--ink); padding: 18px 0 0;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  font-family: var(--font-sans); font-weight: 800; font-size: 10.5px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft);
  margin-top: 8px;
}
.stamp { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--ink); padding: 6px 10px; background: var(--paper-3); font-weight: 900; letter-spacing: 0.16em; transform: rotate(-1.5deg); box-shadow: 2px 2px 0 var(--ink); color: var(--ink); }
.stamp img { width: 18px; height: 18px; display: block; }
.line { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: none; color: var(--ink); margin-bottom: 10px; }
</style></head><body><div class="surface">
<div class="line">DRESS 2 SWEAT — SECRET LOCATION — CALL 0161 115 3007 FOR DETAILS</div>
<div class="foot">
  <span>© 2026 a hold it down productions dub</span>
  <span>Manchester · 0161</span>
  <span class="stamp"><img src="../favicon.svg" alt="">Hold It Down</span>
</div>
</div></body></html>
