<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>BuJo Glyphs</title>
<style>
.legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); background: var(--paper-2); margin-right: 12px; }
.cell { padding: 16px 12px; border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cell:last-child { border-right: none; }
.g { font-family: var(--font-sans); font-size: 32px; line-height: 1; color: var(--ink); font-weight: 700; }
.lab { font-family: var(--font-sans); font-weight: 900; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.eye { font-family: var(--font-sans); font-weight: 900; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.glyphs2 { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
.gtag { font-family: var(--font-sans); font-size: 18px; border: 2px solid var(--ink); padding: 6px 10px; background: var(--paper-3); }
.gtag span { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-left: 8px; }
</style></head><body><div class="surface">
<div class="eye">Bullet Journal Glyphs</div>
<div class="legend">
  <div class="cell"><div class="g">•</div><div class="lab">Task</div></div>
  <div class="cell"><div class="g">△</div><div class="lab">Event</div></div>
  <div class="cell"><div class="g">–</div><div class="lab">Note</div></div>
  <div class="cell"><div class="g">✻</div><div class="lab">Priority</div></div>
  <div class="cell"><div class="g">!</div><div class="lab">Idea</div></div>
</div>
<div class="eye" style="margin-top:18px;">Section Glyphs (UI)</div>
<div class="glyphs2">
  <span class="gtag">◫ <span>Monthly</span></span>
  <span class="gtag">◈ <span>Collections</span></span>
  <span class="gtag">≡ <span>History</span></span>
  <span class="gtag">✦ <span>AI Review</span></span>
  <span class="gtag">∷ <span>Index</span></span>
  <span class="gtag">⊞ <span>Scan</span></span>
  <span class="gtag">⟵ <span>Lock</span></span>
</div>
</div></body></html>
